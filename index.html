function notify(msg){clearTimeout(toastTimer);$('#toast').textContent=msg;$('#toast').classList.add('show');toastTimer=setTimeout(()=>$('#toast').classList.remove('show'),3200)}
function navigate(n){current=(current+n+products.length)%products.length;selectedSize='';setActive(current);renderDetail()}
$('#prevBtn').onclick=()=>navigate(-1);$('#nextBtn').onclick=()=>navigate(1);$('#closeBtn').onclick=closeDetail;$('#availabilityBtn').onclick=()=>openDetail(active>=0?active:0);$('#cartCta').onclick=()=>{let p=products[current];if(p.upcoming){const email=prompt('Get notified when One of One Tee drops. Enter your email:');if(email&&/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email))notify('Thanks! Notification demo saved for this session.');else if(email)notify('Enter a valid email address.');return}if(!selectedSize){notify('Choose your size first');return}bag++;$('#bagCount').textContent=bag;$('#bagCount').classList.remove('bump');void $('#bagCount').offsetWidth;$('#bagCount').classList.add('bump');notify(`${p.name} · ${selectedSize} added to bag`)};
$('#bagBtn').onclick=()=>notify(bag?`${bag} item${bag===1?'':'s'} in your bag (demo checkout)`:'Your bag is empty');
const openModal=(title,content)=>{$('#navModal').classList.add('open');$('#modalBody').innerHTML=`<h2>${title}</h2><p>${content}</p>`;modalOpen=true;$('#modalExit').focus()};$('#aboutBtn').onclick=()=>openModal('Off the Rail','Small-batch art-led tees and shirts from London. New designs every Friday, printed and stitched with care.');$('#contactBtn').onclick=()=>openModal('Say hello.','For studio enquiries and collaborations, email us at <a href="mailto:hello@offtherail.example">hello@offtherail.example</a>.');$('#modalExit').onclick=()=>{$('#navModal').classList.remove('open');modalOpen=false};
document.addEventListener('keydown',e=>{if(e.key==='Escape'){if(modalOpen)$('#modalExit').click();else if(detailOpen)closeDetail()}if(detailOpen&&!['INPUT','TEXTAREA'].includes(document.activeElement.tagName)){if(e.key==='ArrowLeft'){e.preventDefault();navigate(-1)}if(e.key==='ArrowRight'){e.preventDefault();navigate(1)}}});
let touchStart=null;$('#productOverlay').addEventListener('touchstart',e=>{touchStart={x:e.touches[0].clientX,y:e.touches[0].clientY}},{passive:true});$('#productOverlay').addEventListener('touchend',e=>{if(!touchStart)return;const dx=e.changedTouches[0].clientX-touchStart.x,dy=e.changedTouches[0].clientY-touchStart.y;if(Math.abs(dx)>55&&Math.abs(dx)>Math.abs(dy)*1.3)navigate(dx<0?1:-1);touchStart=null},{passive:true});
let scrollDebounce;$('#railScroll').addEventListener('scroll',()=>{if(window.innerWidth>720||detailOpen)return;clearTimeout(scrollDebounce);scrollDebounce=setTimeout(()=>{const scroll=$('#railScroll'),center=scroll.scrollLeft+scroll.clientWidth/2;let idx=0,dist=Infinity;document.querySelectorAll('.slot').forEach((s,i)=>{let d=Math.abs(s.offsetLeft+s.offsetWidth/2-center);if(d<dist){dist=d;idx=i}});setActive(idx)},75)},{passive:true});
const tickerGap='\u00a0\u00a0\u00a0\u00a0';const msg=`NEW DESIGNS EVERY FRIDAY${tickerGap}✳${tickerGap}SUBSCRIBE TO OUR NEWSLETTER${tickerGap}✳${tickerGap}FREE UK DELIVERY OVER £60${tickerGap}✳${tickerGap}PRINTED AND STITCHED IN LONDON${tickerGap}✳${tickerGap}`;$('#tickerText').textContent=msg.repeat(3);$('#tickerText2').textContent=msg.repeat(3);
makeRail();if(window.innerWidth>720){$('#railStage').addEventListener('mouseleave',()=>!detailOpen&&setActive(-1))}else{setTimeout(()=>setActive(0),1600)}
})();
</script></body></html>
